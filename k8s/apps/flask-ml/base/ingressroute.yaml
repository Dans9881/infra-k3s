apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flask-ml
  namespace: flask-ml

spec:
  entryPoints:
    - web
    - websecure

  routes:
    - match: Host(`tes.kuyen.online`)
      kind: Rule
      services:
        - name: flask-ml
          port: 80

  tls:
    secretName: tes-kuyen-tls
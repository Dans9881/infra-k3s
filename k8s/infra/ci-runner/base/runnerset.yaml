apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerSet
metadata:
  name: github-runner
  namespace: actions-runner
  labels:
    app: github-runner

spec:
  replicas: 1

  repository: Dans9881/flask-ml-app
  serviceName: github-runner
  githubConfigSecret: github-token

  dockerEnabled: false

  selector:
    matchLabels:
      app: github-runner

  template:
    metadata:
      labels:
        app: github-runner

    spec:
      serviceAccountName: runner-sa
      automountServiceAccountToken: true

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      restartPolicy: Always

      volumes:
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}

      containers:
        - name: runner
          image: dans9881/runner:latest
          imagePullPolicy: Always

          env:
            - name: RUNNER_EPHEMERAL
              value: "true"

            - name: RUNNER_LABELS
              value: "k8s,self-hosted,linux"

          volumeMounts:
            - name: work
              mountPath: /runner/_work
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
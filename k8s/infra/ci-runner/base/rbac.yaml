apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-sa
  namespace: actions-runner

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runner-read

rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get","list","watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runner-read-binding

subjects:
- kind: ServiceAccount
  name: runner-sa
  namespace: actions-runner

roleRef:
  kind: ClusterRole
  name: runner-read
  apiGroup: rbac.authorization.k8s.io
apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerSet
metadata:
  name: github-runner
  namespace: actions-runner

spec:
  replicas: 1

  repository: Dans9881/flask-ml-app

  dockerEnabled: false

  selector:
    matchLabels:
      app: github-runner

  serviceName: github-runner

  template:
    metadata:
      labels:
        app: github-runner

    spec:
      serviceAccountName: runner-sa

      securityContext:
        fsGroup: 1000

      containers:
      - name: runner
        image: docker.io/dans9881/runner-kubectl:latest

        env:
        - name: RUNNER_EPHEMERAL
          value: "true"

        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-sa
  namespace: actions-runner

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-minimal
  namespace: actions-runner

rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create","get","list","watch","delete"]

- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-minimal-binding
  namespace: actions-runner

subjects:
- kind: ServiceAccount
  name: runner-sa

roleRef:
  kind: Role
  name: runner-minimal
  apiGroup: rbac.authorization.k8s.io
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-restrict
  namespace: actions-runner

spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

  ingress:
  - {}

  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53

  - to:
    - ipBlock:
        cidr: 0.0.0.0/0

  # implicitly block:
  # - kube-system API (kecuali DNS)
  # - internal service lain (kalau ga di allow)
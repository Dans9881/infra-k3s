apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerSet
metadata:
  name: github-runner
  namespace: actions-runner

spec:
  replicas: 1

  serviceName: github-runner

  selector:
    matchLabels:
      app: github-runner

  template:
    metadata:
      labels:
        app: github-runner

    spec:
      repository: Dans9881/flask-ml-app

      containers:
      - name: runner
        image: summerwind/actions-runner:latest

        env:
        - name: RUNNER_NAME
          value: k8s-runner
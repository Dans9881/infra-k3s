apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerSet
metadata:
  name: github-runner
  namespace: actions-runner

spec:
  replicas: 1
  repository: Dans9881/flask-ml-app
  serviceName: github-runner
  dockerEnabled: false

  selector:
    matchLabels:
      app: github-runner

  template:
    metadata:
      labels:
        app: github-runner

    spec:
      serviceAccountName: runner-sa
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      volumes:
        - name: work
          emptyDir: {}
        - name: kaniko
          emptyDir: {}

      containers:
        - name: runner
          image: dans9881/runner:latest

          env:
            - name: RUNNER_EPHEMERAL
              value: "true"

          volumeMounts:
            - name: work
              mountPath: /runner/_work
            - name: kaniko
              mountPath: /kaniko

          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
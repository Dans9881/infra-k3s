apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: github-runner
  namespace: actions-runner
spec:
  replicas: 1
  template:
    spec:
      repository: Dans9881/platform-k8s

      githubAPITokenFrom:
        secretRef:
          name: github-token
          key: token

      labels:
        - self-hosted
        - k8s
        - buildkit

      nodeSelector:
        kubernetes.io/os: linux

      volumes:
        - name: buildkit
          emptyDir: {}

      securityContext:
        runAsNonRoot: true

      containers:
        - name: runner
          image: summerwind/actions-runner:latest
          env:
            - name: BUILDKIT_HOST
              value: tcp://localhost:1234
            - name: DOCKER_ENABLED
              value: "false"
          volumeMounts:
            - name: buildkit
              mountPath: /tmp/buildkit

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

        - name: buildkitd
          image: moby/buildkit:rootless
          args:
            - "--addr"
            - "tcp://0.0.0.0:1234"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: buildkit
              mountPath: /tmp/buildkit

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
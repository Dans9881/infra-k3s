apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerSet
metadata:
  name: github-runner
  namespace: actions-runner

spec:
  replicas: 1
  repository: Dans9881/flask-ml-app
  serviceName: github-runner
  dockerEnabled: false

  selector:
    matchLabels:
      app: github-runner

  template:
    metadata:
      labels:
        app: github-runner

    spec:
      serviceAccountName: runner-sa
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      volumes:
        - name: work
          emptyDir: {}
        - name: docker-config
          secret:
            secretName: dockerhub-secret
        - name: tmp
          emptyDir: {}

      containers:
        # =========================
        # RUNNER (GitHub Actions)
        # =========================
        - name: runner
          image: dans9881/runner:latest

          env:
            - name: RUNNER_EPHEMERAL
              value: "true"

          volumeMounts:
            - name: work
              mountPath: /runner/_work
            - name: work
              mountPath: /workspace   # 🔥 shared with kaniko
            - name: docker-config
              mountPath: /kaniko/.docker
            - name: tmp
              mountPath: /tmp

          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # 🔥 IMPORTANT (biar gak error lagi)
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

        # =========================
        # KANIKO SIDECAR
        # =========================
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest

          args:
            - "--help"   # idle mode

          volumeMounts:
            - name: work
              mountPath: /workspace
            - name: docker-config
              mountPath: /kaniko/.docker
            - name: tmp
              mountPath: /tmp

          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
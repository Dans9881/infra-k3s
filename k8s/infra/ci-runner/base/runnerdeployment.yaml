apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: github-runner
  namespace: actions-runner
spec:
  replicas: 1
  template:
    spec:
      repository: Dans9881/platform-k8s

      githubAPITokenFrom:
        secretRef:
          name: github-token
          key: token

      labels:
        - self-hosted
        - k8s
        - buildkit

      securityContext:
        fsGroup: 1000

      volumes:
        - name: buildkit
          emptyDir: {}

      containers:
        - name: runner
          image: summerwind/actions-runner:latest

          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

          env:
            - name: BUILDKIT_HOST
              value: tcp://localhost:1234
            - name: DOCKER_ENABLED
              value: "false"

          volumeMounts:
            - name: buildkit
              mountPath: /tmp/buildkit

          resources:
            limits:
              cpu: "1"
              memory: "1Gi"

        - name: buildkitd
          image: moby/buildkit:rootless

          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false

          args:
            - "--addr"
            - "tcp://0.0.0.0:1234"

          volumeMounts:
            - name: buildkit
              mountPath: /tmp/buildkit

          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
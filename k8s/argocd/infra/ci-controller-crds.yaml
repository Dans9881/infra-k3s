apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ci-controller-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  project: default

  source:
    repoURL: https://github.com/Dans9881/platform-k8s
    targetRevision: main
    path: k8s/infra/ci-controller/crds

  destination:
    server: https://kubernetes.default.svc
    namespace: actions-runner-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
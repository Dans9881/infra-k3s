apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ci-runner
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Dans9881/platform-k8s
    targetRevision: main
    path: k8s/infra/ci-runner/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: actions-runner

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-sa
  namespace: actions-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-job-role
  namespace: actions-runner
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]

  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-job-binding
  namespace: actions-runner
subjects:
  - kind: ServiceAccount
    name: runner-sa
    namespace: actions-runner
roleRef:
  kind: Role
  name: runner-job-role
  apiGroup: rbac.authorization.k8s.io
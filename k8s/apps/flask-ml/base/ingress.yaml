apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-ml
  namespace: flask-ml
spec:
  ingressClassName: traefik
  rules:
    - host: app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-ml
                port:
                  number: 80
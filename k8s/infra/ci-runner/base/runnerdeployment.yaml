apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerSet
metadata:
  name: github-runner
  namespace: actions-runner
spec:
  replicas: 1
  template:
    spec:
      repository: Dans9881/flask-ml-app

      containers:
      - name: runner
        image: summerwind/actions-runner:latest

        env:
        - name: BUILDKIT_HOST
          value: tcp://localhost:1234

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "200m"
            memory: "256Mi"

      - name: buildkit
        image: moby/buildkit:rootless

        args:
          - --addr
          - tcp://0.0.0.0:1234

        env:
        - name: BUILDKITD_FLAGS
          value: --oci-worker-no-process-sandbox

        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

        volumeMounts:
        - name: docker-config
          mountPath: /home/user/.docker
          readOnly: true

        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"

      volumes:
      - name: docker-config
        secret:
          secretName: docker-config
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-sa
  namespace: actions-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kaniko-builder
  namespace: actions-runner
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create","delete","get","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kaniko-builder-binding
  namespace: actions-runner

subjects:
- kind: ServiceAccount
  name: runner-sa

roleRef:
  kind: Role
  name: kaniko-builder
  apiGroup: rbac.authorization.k8s.io
apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerSet
metadata:
  name: github-runner
spec:
  replicas: 1

  repository: Dans9881/flask-ml-app

  selector:
    matchLabels:
      app: github-runner

  serviceName: github-runner

  template:
    metadata:
      labels:
        app: github-runner

    spec:
      securityContext:
        fsGroup: 1000

      containers:
      - name: runner
        image: summerwind/actions-runner:latest
        env:
        - name: RUNNER_REPO
          value: Dans9881/flask-ml-app
        - name: BUILDKIT_HOST
          value: tcp://localhost:1234

        volumeMounts:
        - name: docker-config
          mountPath: /home/runner/.docker
          readOnly: true

      - name: buildkit
        image: moby/buildkit:rootless
        args:
          - --addr
          - tcp://0.0.0.0:1234

        env:
        - name: BUILDKITD_FLAGS
          value: --oci-worker-no-process-sandbox

        securityContext:
          runAsUser: 1000
          runAsGroup: 1000

        volumeMounts:
        - name: docker-config
          mountPath: /home/user/.docker
          readOnly: true

      volumes:
      - name: docker-config
        secret:
          secretName: docker-config